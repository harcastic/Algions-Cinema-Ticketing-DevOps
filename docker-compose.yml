services:
  api:
    image: ${DOCKERHUB_USERNAME}/cinema-ticketing-api-img:${IMAGE_TAG}
    container_name: cinema-ticketing-api
    restart: unless-stopped

    ports:
      - "127.0.0.1:5000:5000"

    environment:
      PORT: "5000"
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
